<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c6cf0" />
    <title>MKT202 Study</title>
    <script>
      (function () {
        if (!location.hostname.endsWith("github.io")) return;
        var segments = location.pathname.split("/").filter(Boolean);
        if (segments.length === 0) return;
        var base = document.createElement("base");
        base.href = "/" + segments[0] + "/";
        document.head.appendChild(base);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div id="app">
      <div class="app-bg" aria-hidden="true"></div>
      <header class="top-bar">
        <div class="top-bar-inner">
          <div class="avatar" aria-hidden="true">📚</div>
          <div class="greet-block">
            <p class="greeting">Hello, student</p>
            <p class="progress-line">
              Progress: <strong id="header-pct">0%</strong>
            </p>
          </div>
          <div id="countdown" class="pill-badge" aria-live="polite"></div>
        </div>
      </header>
      <main id="view">
        <p class="lead loading-msg">Loading your study space…</p>
      </main>
      <nav class="bottom-nav" aria-label="Main">
        <a href="#/" data-route="#/" class="nav-item"
          ><span class="nav-icon" aria-hidden="true">🏠</span><span>Home</span></a
        >
        <a href="#/study" data-route="#/study" class="nav-item"
          ><span class="nav-icon" aria-hidden="true">📖</span><span>Units</span></a
        >
        <a href="#/quiz" data-route="#/quiz" class="nav-item"
          ><span class="nav-icon" aria-hidden="true">⚡</span><span>Quiz</span></a
        >
        <a href="#/papers" data-route="#/papers" class="nav-item"
          ><span class="nav-icon" aria-hidden="true">📄</span><span>Papers</span></a
        >
        <a href="#/flashcards" data-route="#/flashcards" class="nav-item"
          ><span class="nav-icon" aria-hidden="true">🃏</span><span>Cards</span></a
        >
        <a href="#/practice" data-route="#/practice" class="nav-item"
          ><span class="nav-icon" aria-hidden="true">✍️</span><span>Practice</span></a
        >
      </nav>
    </div>
    <script src="data.js?v=5"></script>
    <script src="app.js?v=5"></script>
  </body>
</html>
